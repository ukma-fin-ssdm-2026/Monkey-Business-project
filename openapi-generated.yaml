components:
  schemas:
    CardCreate:
      properties:
        company:
          type: string
          maxLength: 200
          minLength: 1
          title: Company
          description: Назва компанії (обов'язкове поле, FR-007)
          examples:
          - Acme Corp
        position:
          type: string
          maxLength: 200
          minLength: 1
          title: Position
          description: Назва позиції (обов'язкове поле, FR-007)
          examples:
          - Backend Engineer
        vacancy_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Vacancy Url
          description: Посилання на оригінальну вакансію
          examples:
          - https://acme.example.com/jobs/42
        requirements_text:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Requirements Text
          description: Текст вимог вакансії (FR-007, FR-003 розширення)
          examples:
          - 3+ роки Python, знання FastAPI
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
          description: Дедлайн тестового завдання або співбесіди (FR-010)
          examples:
          - '2026-10-20T18:00:00Z'
