openapi: 3.1.0
info:
  title: Tech Interview Board API
  description: REST API для трекера підготовки до технічних співбесід (Code-First).
  version: 0.1.0
paths:
  /v1/boards/{board_id}/stages:
    get:
      tags:
      - Stages
      summary: Список етапів Канбан-дошки
      description: Повертає всі етапи вказаної дошки, відсортовані за порядком відображення
        order_index (FR-003).
      operationId: list_stages
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageOut'
                title: Response List Stages
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний ідентифікатор дошки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Stages
      summary: Створити новий етап дошки
      description: Створює новий кастомний етап для вказаної дошки. Дозволено лише
        кандидату-власнику дошки або адміністратору.
      operationId: create_stage
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалідна назва етапу або параметри
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/stages/{stage_id}:
    patch:
      tags:
      - Stages
      summary: Оновити етап дошки
      description: Часткове оновлення назви етапу або його порядку сортування. Потрібно
        передати хоча б одне поле для зміни.
      operationId: update_stage
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: stage_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор етапу
          title: Stage Id
        description: Ідентифікатор етапу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку або етап не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалідні дані оновлення
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Stages
      summary: Видалити етап дошки
      description: Видаляє етап із дошки. Якщо в етапі присутні картки вакансій, операція
        повертає 409 Conflict задля збереження цілісності даних.
      operationId: delete_stage
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: stage_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор етапу
          title: Stage Id
        description: Ідентифікатор етапу
      responses:
        '204':
          description: Successful Response
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку або етап не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний ідентифікатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/cards:
    get:
      tags:
      - Cards
      summary: Список карток вакансій на дошці
      description: Повертає картки дошки з опційною фільтрацією за етапом і статусом
        (FR-003, FR-006). Пагінація на основі зсуву (offset), бо дошка — обмежений
        набір карток (до ~100), а не безкінечна стрічка.
      operationId: list_cards
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки-власника карток
          title: Board Id
        description: Ідентифікатор дошки-власника карток
      - name: stage_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Фільтр за етапом
          title: Stage Id
        description: Фільтр за етапом
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CardStatus'
          - type: 'null'
          description: Фільтр за статусом картки
          title: Status
        description: Фільтр за статусом картки
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки (макс. 100)
          default: 20
          title: Limit
        description: Розмір сторінки (макс. 100)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Зсув від початку списку
          default: 0
          title: Offset
        description: Зсув від початку списку
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListResponse'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку не знайдено
          content:
            application/json:
              examples:
                board_not_found:
                  summary: Дошку не знайдено
                  value:
                    error:
                      code: NOT_FOUND
                      message: Дошку не знайдено
                      details: []
                      request_id: req_example
                      documentation: https://github.com/ukma-fin-ssdm-2026/Monkey-Business-project/blob/main/docs/api/api-design.md#error-handling
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалідний фільтр або параметри пагінації
          content:
            application/json:
              examples:
                invalid_query:
                  summary: Невалідні параметри
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Запит містить невалідні поля
                      details:
                      - field: query.limit
                        message: Input should be less than or equal to 100
                        provided_value: '500'
                      request_id: req_example
                      documentation: https://github.com/ukma-fin-ssdm-2026/Monkey-Business-project/blob/main/docs/api/api-design.md#validation
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Cards
      summary: Створити картку вакансії
      description: Створює нову картку в зазначеному етапі дошки (FR-007).
      operationId: create_card
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки, до якої додається картка
          title: Board Id
        description: Ідентифікатор дошки, до якої додається картка
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Дошку або етап не знайдено
          content:
            application/json:
              examples:
                board_not_found:
                  summary: Дошку не знайдено
                  value:
                    error:
                      code: NOT_FOUND
                      message: Дошку не знайдено
                      details: []
                      request_id: req_example
                      documentation: https://github.com/ukma-fin-ssdm-2026/Monkey-Business-project/blob/main/docs/api/api-design.md#error-handling
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Порожнє обов'язкове поле або некоректний формат
          content:
            application/json:
              examples:
                invalid_body:
                  summary: Невалідне тіло запиту
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Запит містить невалідні поля
                      details:
                      - field: company
                        message: String should have at least 1 character
                        provided_value: ''
                      request_id: req_example
                      documentation: https://github.com/ukma-fin-ssdm-2026/Monkey-Business-project/blob/main/docs/api/api-design.md#validation
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/cards/{card_id}:
    get:
      tags:
      - Cards
      summary: Отримати картку за ідентифікатором
      description: Повертає одну картку вакансії з усіма полями (FR-007).
      operationId: get_card
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку або дошку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний ідентифікатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Cards
      summary: Частково оновити картку
      description: 'PATCH, а не PUT: клієнт надсилає лише змінені поля (FR-008). Також
        використовується для закриття картки (`status`, FR-006).'
      operationId: update_card
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку або дошку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалідне значення поля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Cards
      summary: Видалити картку
      description: Видаляє картку остаточно (FR-008). Повторний виклик — теж 404,
        а не помилка.
      operationId: delete_card
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '204':
          description: Successful Response
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку або дошку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний ідентифікатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/cards/{card_id}/move:
    post:
      tags:
      - Cards
      summary: Перемістити картку між етапами (drag-and-drop)
      description: 'Дія як під-ресурс, а не PATCH основного ресурсу: переміщення зачіпає
        позиції інших карток етапу (FR-004, FR-005), тобто це бізнес-операція, а не
        проста заміна поля.'
      operationId: move_card
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardMove'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку, дошку або етап не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний stage_id або position_index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/cards/{card_id}/links:
    get:
      tags:
      - Card Links
      summary: Список посилань на тестові завдання картки
      description: Повертає всі посилання на тестові завдання, додані до картки (FR-009).
      operationId: list_links
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardLinkOut'
                title: Response List Links
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Некоректний ідентифікатор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Card Links
      summary: Додати посилання на тестове завдання
      description: Валідація URL відбувається на рівні типу Pydantic (`HttpUrl`) —
        рядок, що не є коректним URL, відхиляється з 422 (FR-009).
      operationId: create_link
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkOut'
        '401':
          description: Потрібна автентифікація
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостатньо прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Картку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Рядок не є коректним URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/boards/{board_id}/cards/{card_id}/links/{link_id}:
    delete:
      tags:
      - Card Links
      summary: Видалити посилання
      description: Видаляє посилання з картки. Повторний виклик повертає 404.
      operationId: delete_link
      security:
      - HTTPBearer: []
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
