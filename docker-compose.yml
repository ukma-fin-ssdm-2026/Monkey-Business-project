# Інструмент: Claude
# Застосування: Docker Compose для Backend API та PostgreSQL за діаграмою розгортання
# (docs/architecture/uml/deployment-diagram.puml).
# Верифікація: Перевірено вручну: обидва контейнери healthy, міграції застосовуються
# при старті API, дані зберігаються після перезапуску контейнерів.

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_board}
      POSTGRES_USER: ${POSTGRES_USER:-interview_board}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_board}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: alembic and the MCP server can reach the database from the
    # host, while it stays off the network (trust boundary TB-2).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-interview_board}:${POSTGRES_PASSWORD:-interview_board}@db:5432/${POSTGRES_DB:-interview_board}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
