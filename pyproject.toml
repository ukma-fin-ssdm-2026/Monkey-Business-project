[tool.black]
line-length = 88
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The API is imported as the src.api package, the same way CI runs src.api.main.
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"


[tool.coverage.run]
source = ["src/api"]

[tool.coverage.report]
show_missing = true

