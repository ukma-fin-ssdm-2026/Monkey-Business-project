# Інструмент: Copilot.
# Застосування: оновлення patch-версії проєкту після рефакторингів.
# Верифікація: версію перевірено разом із package metadata та OpenAPI.

[project]
name = "monkey-business-project"
version = "0.1.5"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The API is imported as the src.api package, the same way CI runs src.api.main.
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70"
markers = [
    "integration: mark for all integration tests"
]

[tool.coverage.run]
source = ["src/api"]
branch = true
relative_files = true
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.mutmut]
paths_to_mutate = "src/api/validators.py"
tests_dir = "tests/"
runner = "python -m pytest -x -q --no-cov -p no:cacheprovider tests/test_validators.py"
