# Інструмент: Copilot.
# Застосування: безпечне встановлення CI-залежностей лише з binary wheels.
# Верифікація: workflow перевірено та відповідну конфігурацію протестовано.
# Доповнення (Claude Code, Лаб 9, бонус): окремий job «Reliability tests» для
# обов'язкової перевірки PR; команди job прогнано локально перед комітом.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70

      - name: Add coverage summary to job summary
        if: always()
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml


      - name: Verify API integration and OpenAPI generation
        env:
          PYTHONPATH: .
        run: |
          python -m src.api.main
          test -s docs/api/openapi-generated.yaml

      - name: Check for spec drift
        run: git diff --exit-code docs/api/

  # Lab 09 bonus: reliability tests run as their own job so that branch
  # protection can list "Reliability tests" as a required check for main.
  # No paths filter on purpose: a required check that is skipped by a filter
  # stays "Expected — waiting" and blocks the PR.
  reliability-tests:
    name: Reliability tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock

      # --no-cov: the 70 % gate from pyproject addopts applies to the full
      # suite in the build job, not to this subset.
      - name: Run backend reliability tests (tests/reliability)
        run: python -m pytest tests/reliability --no-cov -v --junitxml=reliability-junit.xml

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts

      # npm script, not npx: vitest comes from package-lock.json via npm ci,
      # so nothing unpinned can be fetched from the registry at run time.
      - name: Run frontend reliability tests (R5-R8)
        working-directory: src/frontend
        run: npm run test:unit -- tests/reliability.test.tsx

      - name: Add reliability summary to job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              suite = ET.parse("reliability-junit.xml").getroot()
              suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
              a = suite.attrib
              print("### Reliability tests (tests/reliability)")
              print(f"- tests: {a.get('tests')}, failures: {a.get('failures')}, "
                    f"errors: {a.get('errors')}, skipped: {a.get('skipped')}")
          except (OSError, ET.ParseError):
              print("### Reliability tests: no JUnit report produced")
          PY
