name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=70

      - name: Add coverage summary to job summary
        if: always()
        run: |
          echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml


      - name: Verify API integration and OpenAPI generation
        env:
          PYTHONPATH: .
        run: |
          python -m src.api.main
          test -s docs/api/openapi-generated.yaml

      - name: Check for spec drift
        run: git diff --exit-code docs/api/

  integration:
    runs-on: [self-hosted, linux]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: interview_board_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test  # pragma: allowlist secret
        # Container port only: the host port is picked at random, so parallel
        # jobs on a shared self-hosted runner do not collide on 5432.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U test -d interview_board_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Unit and integration tests together give the combined API coverage
      # that docs/validation/test-plan.md uses as an exit criterion.
      - name: Run unit and integration tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:${{ job.services.postgres.ports['5432'] }}/interview_board_test  # pragma: allowlist secret
        run: pytest -m "postgres or not postgres"

      - name: Add coverage summary to job summary
        if: always()
        run: |
          echo "### Combined Coverage (unit + integration)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
