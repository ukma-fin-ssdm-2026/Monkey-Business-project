name: Lab07 card ordering

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-card-order:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: monkey_lab07
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monkey_lab07"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-lab07.lock
      - name: Run TP-02, TP-03, TP-04, TP-06, TP-10 and TP-11 against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/monkey_lab07
        run: >-
          python -m pytest tests/test_card_order.py tests/test_card_order_postgres.py
          tests/integration --no-cov -v --junitxml=lab07-card-order.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab07-card-order
          path: lab07-card-order.xml
