# Tool: Antigravity
# Application: Assisted in setting up the CI/CD pipeline for OpenAPI generation and GitHub Pages deployment.
# Verification: Verified manually by reviewing the workflow syntax and execution steps.
name: Generate and Deploy API Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/api/**'
      - 'docs/api/**'
      - 'requirements.txt'

jobs:
  generate-and-deploy:
    runs-on: [self-hosted, linux]
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements.lock
      
      - name: Generate OpenAPI spec from code
        env:
          PYTHONPATH: .
        run: |
          python -c "from src.api.main import app, save_openapi_spec; save_openapi_spec(app)"
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./docs/api
