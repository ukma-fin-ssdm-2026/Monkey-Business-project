# Інструмент: Claude Code.
# Застосування: Лаб 10, бонус «Пошук нестабільних тестів» — повний набір тестів
# (pytest разом з інтеграційними тестами на PostgreSQL у контейнері + Vitest)
# повторюється кілька разів поспіль на одному коміті, а scripts/find_flaky_tests.py
# виводить тести, результат яких між повторами відрізнявся.
# Верифікація: цикл цього файлу прогнано локально 5 разів проти PostgreSQL 16
# у Docker, зокрема зі штучно нестабільним тестом; скрипт покрито
# tests/test_find_flaky_tests.py.
#
# Усі команди курсу ділять чотири раннери, тому: лише ручний запуск, одне
# завдання без матриці (сервіс PostgreSQL працює на тому самому раннері),
# а concurrency ставить повторний запуск у чергу замість другого раннера.
name: Lab10 flaky tests

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Скільки разів повторити повний набір тестів (5–10)"
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: lab10-flaky-tests
  cancel-in-progress: false

jobs:
  flaky-tests:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      REPEATS: ${{ inputs.repeats }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: monkey_flaky
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monkey_flaky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check the number of repeats
        run: |
          if ! [[ "$REPEATS" =~ ^[0-9]+$ ]] || (( REPEATS < 5 || REPEATS > 10 )); then
            echo "::error::repeats must be between 5 and 10, got '$REPEATS'"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts

      # A failing repeat must not stop the loop: the comparison step decides
      # whether the job fails. Directories are zero-padded so that the shell
      # glob in the next step keeps run order for 10 repeats.
      - name: Run the full test suite ${{ inputs.repeats }} times on one commit
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/monkey_flaky
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          for i in $(seq 1 "$REPEATS"); do
            out="$PWD/flaky-runs/run-$(printf '%02d' "$i")"
            mkdir -p "$out"
            echo "::group::Repeat $i of $REPEATS"
            python -m pytest --no-cov -p no:cacheprovider -q --junitxml="$out/backend.xml" \
              || echo "pytest exited with $? in repeat $i"
            (cd src/frontend && npm run test:unit -- --reporter=default --reporter=junit \
              --outputFile.junit="$out/frontend.xml") \
              || echo "vitest exited with $? in repeat $i"
            echo "::endgroup::"
          done

      - name: List tests whose result differed between repeats
        run: python scripts/find_flaky_tests.py flaky-runs/run-* --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit reports of every repeat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab10-flaky-tests
          path: flaky-runs/
          if-no-files-found: ignore
