openapi: 3.1.0
info:
  title: Tech Interview Board API
  description: REST API для трекера підготовки до технічних співбесід (Code-First).
  version: 0.1.0
paths:
  /boards/{board_id}/cards:
    get:
      tags:
      - Cards
      summary: Список карток вакансій на дошці
      description: Повертає картки дошки з опційною фільтрацією за етапом і статусом
        (FR-003, FR-006). Пагінація на основі зсуву (offset), бо дошка — обмежений
        набір карток (до ~100), а не безкінечна стрічка.
      operationId: list_cards_boards__board_id__cards_get
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки-власника карток
          title: Board Id
        description: Ідентифікатор дошки-власника карток
      - name: stage_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Фільтр за етапом
          title: Stage Id
        description: Фільтр за етапом
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Фільтр за статусом картки
          title: Status
        description: Фільтр за статусом картки
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Розмір сторінки (макс. 100)
          default: 20
          title: Limit
        description: Розмір сторінки (макс. 100)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Зсув від початку списку
          default: 0
          title: Offset
        description: Зсув від початку списку
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardListResponse'
        '404':
          description: Дошку не знайдено
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Cards
      summary: Створити картку вакансії
      description: Створює нову картку в зазначеному етапі дошки (FR-007).
      operationId: create_card_boards__board_id__cards_post
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки, до якої додається картка
          title: Board Id
        description: Ідентифікатор дошки, до якої додається картка
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '404':
          description: Дошку не знайдено
        '422':
          description: Порожнє обов'язкове поле або некоректний формат
  /boards/{board_id}/cards/{card_id}:
    get:
      tags:
      - Cards
      summary: Отримати картку за ідентифікатором
      operationId: get_card_boards__board_id__cards__card_id__get
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '404':
          description: Картку або дошку не знайдено
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Cards
      summary: Частково оновити картку
      description: 'PATCH, а не PUT: клієнт надсилає лише змінені поля (FR-008). Також
        використовується для закриття картки (`status`, FR-006).'
      operationId: update_card_boards__board_id__cards__card_id__patch
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '404':
          description: Картку або дошку не знайдено
        '422':
          description: Невалідне значення поля
    delete:
      tags:
      - Cards
      summary: Видалити картку
      description: Видаляє картку остаточно (FR-008). Повторний виклик — теж 404,
        а не помилка.
      operationId: delete_card_boards__board_id__cards__card_id__delete
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '204':
          description: Successful Response
        '404':
          description: Картку або дошку не знайдено
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /boards/{board_id}/cards/{card_id}/move:
    post:
      tags:
      - Cards
      summary: Перемістити картку між етапами (drag-and-drop)
      description: 'Дія як під-ресурс, а не PATCH основного ресурсу: переміщення зачіпає
        позиції інших карток етапу (FR-004, FR-005), тобто це бізнес-операція, а не
        проста заміна поля.'
      operationId: move_card_boards__board_id__cards__card_id__move_post
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardMove'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOut'
        '404':
          description: Картку або дошку не знайдено
        '422':
          description: Некоректний stage_id або position
  /boards/{board_id}/cards/{card_id}/links:
    get:
      tags:
      - Card Links
      summary: Список посилань на тестові завдання картки
      operationId: list_links_boards__board_id__cards__card_id__links_get
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardLinkOut'
                title: Response List Links Boards  Board Id  Cards  Card Id  Links
                  Get
        '404':
          description: Картку не знайдено
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Card Links
      summary: Додати посилання на тестове завдання
      description: Валідація URL відбувається на рівні типу Pydantic (`HttpUrl`) —
        рядок, що не є коректним URL, відхиляється з 422 (FR-009).
      operationId: create_link_boards__board_id__cards__card_id__links_post
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLinkCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardLinkOut'
        '404':
          description: Картку не знайдено
        '422':
          description: Рядок не є коректним URL
  /boards/{board_id}/cards/{card_id}/links/{link_id}:
    delete:
      tags:
      - Card Links
      summary: Видалити посилання
      operationId: delete_link_boards__board_id__cards__card_id__links__link_id__delete
      parameters:
      - name: board_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор дошки
          title: Board Id
        description: Ідентифікатор дошки
      - name: card_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор картки
          title: Card Id
        description: Ідентифікатор картки
      - name: link_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор посилання
          title: Link Id
        description: Ідентифікатор посилання
      responses:
        '204':
          description: Successful Response
        '404':
          description: Посилання або картку не знайдено
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - Meta
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Health Health Get
components:
  schemas:
    CardCreate:
      properties:
        company:
          type: string
          maxLength: 200
          minLength: 1
          title: Company
          description: Назва компанії (обов'язкове поле, FR-007)
          examples:
          - Acme Corp
        position:
          type: string
          maxLength: 200
          minLength: 1
          title: Position
          description: Назва позиції (обов'язкове поле, FR-007)
          examples:
          - Backend Engineer
        vacancy_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Vacancy Url
          description: Посилання на оригінальну вакансію
        requirements_text:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Requirements Text
          description: Текст вимог вакансії (FR-007, FR-003 розширення)
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
          description: Дедлайн тестового завдання або співбесіди (FR-010)
        notifications_enabled:
          type: boolean
          title: Notifications Enabled
          description: Чи увімкнені нагадування для цієї картки (FR-018)
          default: true
        stage_id:
          type: string
          format: uuid
          title: Stage Id
          description: Етап, у якому створюється картка
      type: object
      required:
      - company
      - position
      - stage_id
      title: CardCreate
      description: Тіло запиту на створення картки (FR-007).
    CardLinkCreate:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
          description: Посилання на тестове завдання (валідний URL)
      type: object
      required:
      - url
      title: CardLinkCreate
    CardLinkOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        card_id:
          type: string
          format: uuid
          title: Card Id
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - card_id
      - url
      - created_at
      title: CardLinkOut
    CardListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CardOut'
          type: array
          title: Items
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      type: object
      required:
      - items
      - pagination
      title: CardListResponse
    CardMove:
      properties:
        stage_id:
          type: string
          format: uuid
          title: Stage Id
          description: Ідентифікатор цільового етапу
        position:
          type: integer
          minimum: 0.0
          title: Position
          description: Позиція картки в межах етапу (0 = перша зверху)
      type: object
      required:
      - stage_id
      - position
      title: CardMove
      description: Переміщення картки між етапами методом drag-and-drop (FR-004, FR-005).
    CardOut:
      properties:
        company:
          type: string
          maxLength: 200
          minLength: 1
          title: Company
          description: Назва компанії (обов'язкове поле, FR-007)
          examples:
          - Acme Corp
        position:
          type: integer
          title: Position
        vacancy_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Vacancy Url
          description: Посилання на оригінальну вакансію
        requirements_text:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Requirements Text
          description: Текст вимог вакансії (FR-007, FR-003 розширення)
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
          description: Дедлайн тестового завдання або співбесіди (FR-010)
        notifications_enabled:
          type: boolean
          title: Notifications Enabled
          description: Чи увімкнені нагадування для цієї картки (FR-018)
          default: true
        id:
          type: string
          format: uuid
          title: Id
        board_id:
          type: string
          format: uuid
          title: Board Id
        stage_id:
          type: string
          format: uuid
          title: Stage Id
        status:
          $ref: '#/components/schemas/CardStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - company
      - position
      - id
      - board_id
      - stage_id
      - status
      - created_at
      - updated_at
      title: CardOut
    CardStatus:
      type: string
      enum:
      - active
      - rejected
      - offer_accepted
      title: CardStatus
    CardUpdate:
      properties:
        company:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Company
        position:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Position
        vacancy_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Vacancy Url
        requirements_text:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Requirements Text
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
        notifications_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Notifications Enabled
        status:
          anyOf:
          - $ref: '#/components/schemas/CardStatus'
          - type: 'null'
          description: 'Закриття картки: ''rejected'' або ''offer_accepted'' (FR-006)'
      type: object
      title: CardUpdate
      description: Часткове оновлення картки (PATCH, FR-008) — усі поля опційні.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PaginationMeta:
      properties:
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          description: Розмір сторінки (макс. 100)
        offset:
          type: integer
          minimum: 0.0
          title: Offset
          description: Зсув від початку списку
        total:
          type: integer
          minimum: 0.0
          title: Total
          description: Загальна кількість елементів у ресурсі
      type: object
      required:
      - limit
      - offset
      - total
      title: PaginationMeta
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
